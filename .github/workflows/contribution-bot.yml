name: Contribution Bot

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]
  discussion_comment:
    types: [created]

jobs:
  bot:
    uses: AvaloniaUI/Avalonia.ContributionBot/.github/workflows/contribution-bot.yml@v1
    with:
      client-id: ${{ vars.CONTRIBUTION_BOT_CLIENT_ID }}
      store-repository: AvaloniaUI/AvaloniaCLADepository
      command-prefix: "!contribution-bot"
      cla-url: https://github.com/AvaloniaUI/Avalonia/blob/main/CLA.md
      introduction-url: https://github.com/AvaloniaUI/Avalonia/discussions/new?category=introductions
    secrets:
      private-key: ${{ secrets.CONTRIBUTION_BOT_PRIVATE_KEY }}
