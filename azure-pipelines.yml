jobs:

- job: GetPRNumber
  pool:
    vmImage: 'ubuntu-24.04'
  variables:
    SolutionDir: '$(Build.SourcesDirectory)'
  steps:
  - task: UseDotNet@2
    displayName: 'Use .NET 10.0 Runtime'
    inputs:
        packageType: runtime
        version: 10.0.x
  - task: UseDotNet@2
    displayName: 'Use .NET SDK'
    inputs:
      packageType: sdk
      useGlobalJson: true
      includePreviewVersions: true
  - task: CmdLine@2
    displayName: 'Run Build'
    inputs:
        script: ./build.sh --target OutputVersion --version-output-dir $(Build.ArtifactStagingDirectory)
  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)'
      ArtifactName: 'PRNumber'
      publishLocation: 'Container'
      
- job: Linux
  pool:
    vmImage: 'ubuntu-24.04'
  steps:
 
  - script: df -h .
    displayName: 'Check disk space'
  - script: sudo rm -rf \
      /usr/local/lib/android \
      /opt/ghc \
      /usr/share/swift \
      /usr/local/.ghcup \
      /usr/lib/jvm
      /usr/share/miniconda \
      /usr/local/lib/node_modules \
      /usr/local/share/powershell \
      /usr/local/share/chromedriver \
      /usr/local/share/gecko_driver \
      /usr/local/share/edge_driver \
      /opt/hostedtoolcache/CodeQL
    displayName: 'Free disk space'
  - script: df -h .
    displayName: 'Check disk space after cleanup'

  - task: UseDotNet@2
    displayName: 'Use .NET 10.0 Runtime'
    inputs:
        packageType: runtime
        version: 10.0.x

  - task: UseDotNet@2
    displayName: 'Use .NET SDK'
    inputs:
      packageType: sdk
      useGlobalJson: true
      includePreviewVersions: true

  - task: CmdLine@2
    displayName: 'Install Workloads'
    inputs:
      script: |
       dotnet workload install android macos wasm-tools

  - task: CmdLine@2
    displayName: 'Run Build'
    inputs:
      script: |
        dotnet --info
        printenv
        ./build.sh --target CiAzureLinux --configuration=Release

  - task: PublishTestResults@2
    inputs:
      testResultsFormat: 'VSTest'
      testResultsFiles: '$(Build.SourcesDirectory)/artifacts/test-results/*.trx'
    condition: not(canceled())
     

- job: macOS
  variables:
    SolutionDir: '$(Build.SourcesDirectory)'
  pool:
    vmImage: 'macos-15'
  steps:
  - task: UseDotNet@2
    displayName: 'Use .NET 10.0 Runtime'
    inputs:
        packageType: runtime
        version: 10.0.x

  - task: UseDotNet@2
    displayName: 'Use .NET SDK'
    inputs:
      packageType: sdk
      useGlobalJson: true
      includePreviewVersions: true

  - task: CmdLine@2
    displayName: 'Install Workloads'
    inputs:
      script: |
       dotnet workload install android ios maccatalyst macos wasm-tools
  
  - task: CmdLine@2
    displayName: 'Generate avalonia-native'
    inputs:
      script: |
        export COREHOST_TRACE=0
        export DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1
        export DOTNET_CLI_TELEMETRY_OPTOUT=1
        ./build.sh --target GenerateCppHeaders --configuration Release 

  - task: Xcode@5
    inputs:
      actions: 'build'
      scheme: ''
      sdk: 'macosx26.0'
      configuration: 'Release'
      xcWorkspacePath: '**/*.xcodeproj/project.xcworkspace'
      xcodeVersion: 'specifyPath' # Options: 8, 9, default, specifyPath
      xcodeDeveloperDir: '/Applications/Xcode_26.0.app/Contents/Developer'
      args: '-derivedDataPath ./'

  - task: CmdLine@2
    displayName: 'Run Build'
    inputs:
      script: |
        export COREHOST_TRACE=0
        export DOTNET_SKIP_FIRST_TIME_EXPERIENCE=1
        export DOTNET_CLI_TELEMETRY_OPTOUT=1
        which dotnet
        dotnet --info
        printenv
        ./build.sh --target CiAzureOSX --configuration Release --skip-previewer

  - task: PublishTestResults@2
    inputs:
      testResultsFormat: 'VSTest'
      testResultsFiles: '$(Build.SourcesDirectory)/artifacts/test-results/*.trx'
    condition: not(canceled())
  
  - task: PublishBuildArtifacts@1
    inputs:
      pathToPublish: '$(Build.SourcesDirectory)/Build/Products/Release/'
      artifactName: 'Avalonia.Native.OSX'
    condition: succeeded()
    
  - task: PublishBuildArtifacts@1
    inputs:
      pathtoPublish: '$(Build.SourcesDirectory)/artifacts/nuget'
      artifactName: 'NuGetOSX'
    condition: succeeded()

  - task: PublishBuildArtifacts@1
    inputs:
      pathtoPublish: '$(Build.SourcesDirectory)/artifacts/sbom'
      artifactName: 'SBOMOSX'
    condition: succeeded()

- job: Windows
  pool:
    vmImage: 'windows-2025'
  variables:
    SolutionDir: '$(Build.SourcesDirectory)'
  steps:
  - task: UseDotNet@2
    displayName: 'Use .NET 10.0 SDK'
    inputs:
        # We need SDK on Windows machine to get windowsdesktop runtime included
        # It's not installed with plain "packageType: runtime" 
        packageType: sdk
        version: 10.0.x

  - task: UseDotNet@2
    displayName: 'Use .NET SDK'
    inputs:
      packageType: sdk
      useGlobalJson: true
      includePreviewVersions: true

  - task: CmdLine@2
    displayName: 'Install Workloads'
    inputs:
      script: |
       dotnet workload install android maccatalyst ios tvos wasm-tools

  - task: CmdLine@2
    displayName: 'Install Nuke'
    inputs:
      script: |
       dotnet tool install --global Nuke.GlobalTool --version 9.0.4 

  - task: CmdLine@2
    displayName: 'Run Nuke'
    inputs:
      script: |
        set PATH=%PATH%;%USERPROFILE%\.dotnet\tools
        nuke --target CiAzureWindows --configuration Release
      
  - task: PublishTestResults@2
    inputs:
      testResultsFormat: 'VSTest'
      testResultsFiles: '$(Build.SourcesDirectory)/artifacts/test-results/*.trx'
    condition: not(canceled())

  - task: PublishBuildArtifacts@1
    inputs:
      pathtoPublish: '$(Build.SourcesDirectory)/artifacts/nuget'
      artifactName: 'NuGet'
    condition: succeeded()

  - task: PublishBuildArtifacts@1
    inputs:
      pathToPublish: '$(Build.SourcesDirectory)/artifacts/zip'
      artifactName: 'Samples'
    condition: succeeded()

  - task: PublishBuildArtifacts@1
    inputs:
      pathtoPublish: '$(Build.SourcesDirectory)/artifacts/sbom'
      artifactName: 'SBOM'
    condition: succeeded()

